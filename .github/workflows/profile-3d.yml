name: Update contribution landscape

on:
  schedule:
    - cron: "17 20 * * *" # 05:17 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-landscape
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generate activity images
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Save generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/*.svg
          if git diff --cached --quiet; then
            echo "Activity images are already current."
          else
            git commit -m "chore: refresh contribution landscape"
            git push
          fi
